apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
  namespace: fiapstore
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=payments-db;Port=5432;Database=Db.Payments;Username=postgres;Password=POSTGRES_PASSWORD_PLACEHOLDER"
  Jwt__Key: "JWT_KEY_PLACEHOLDER"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "POSTGRES_PASSWORD_PLACEHOLDER"
  POSTGRES_DB: "Db.Payments"
  AWS_ACCESS_KEY_ID: "AWS_ACCESS_KEY_ID_PLACEHOLDER"
  AWS_SECRET_ACCESS_KEY: "AWS_SECRET_ACCESS_KEY_PLACEHOLDER"
  AWS_DEFAULT_REGION: "us-east-2"
  NEW_RELIC_LICENSE_KEY: "NEW_RELIC_LICENSE_KEY_PLACEHOLDER"
